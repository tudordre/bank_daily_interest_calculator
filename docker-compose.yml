services:
  app:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/springbatchdb
      SPRING_DATASOURCE_USERNAME: springbatch
      SPRING_DATASOURCE_PASSWORD: springbatchpass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_LIQUIBASE_CHANGELOG: classpath:/db/changelog/db.changelog-master.yaml
      SPRING_BATCH_JOB_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: springbatchdb
      POSTGRES_USER: springbatch
      POSTGRES_PASSWORD: springbatchpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springbatch -d springbatchdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
