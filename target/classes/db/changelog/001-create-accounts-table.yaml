databaseChangeLog:
  - changeSet:
      id: 001-create-accounts-table
      author: copilot
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: balance
                  type: decimal(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: interest_rate
                  type: decimal(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
