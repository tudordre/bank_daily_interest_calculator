databaseChangeLog:
  - changeSet:
      id: 002-create-statements-table
      author: copilot
      changes:
        - createTable:
            tableName: statements
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: opening_balance
                  type: decimal(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: closing_balance
                  type: decimal(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: generated_at
                  type: date
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: statements
            baseColumnNames: account_id
            constraintName: fk_statements_accounts
            referencedTableName: accounts
            referencedColumnNames: id
